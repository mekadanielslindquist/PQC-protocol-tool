Organizations:
  - Name: Hospital_A
    ID: HospitalAMSP
    MSPDir: organizations/hospital_a/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('HospitalAMSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('HospitalAMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('HospitalAMSP.admin')"
    OrdererEndpoints:
      - orderer.example.com:7050
    AnchorPeers:
      - Host: peer0.org1.example.com
        Port: 7051

  - Name: Hospital_B
    ID: HospitalBMSP
    MSPDir: organizations/hospital_b/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('HospitalBMSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('HospitalBMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('HospitalBMSP.admin')"
    OrdererEndpoints:
      - orderer.example.com:7050
    AnchorPeers:
      - Host: peer0.org2.example.com
        Port: 9051