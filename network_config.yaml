Organizations:
  - &OrdererOrg
    Name: OrdererOrg
    ID: OrdererMSP
    MSPDir: crypto-config/ordererOrganizations/example.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('OrdererMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"

  - &Hospital_A
    Name: Hospital_A
    ID: Hospital_AMSP
    MSPDir: crypto-config/peerOrganizations/Hospital_A.example.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('Hospital_AMSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('Hospital_AMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('Hospital_AMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('Hospital_AMSP.member')"
    OrdererEndpoints:
      - orderer.example.com:7050
    AnchorPeers:
      - Host: peer0.Hospital_A.example.com
        Port: 7051

  - &Hospital_B
    Name: Hospital_B
    ID: Hospital_BMSP
    MSPDir: crypto-config/peerOrganizations/Hospital_B.example.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('Hospital_BMSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('Hospital_BMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('Hospital_BMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('Hospital_BMSP.member')"
    OrdererEndpoints:
      - orderer.example.com:7050
    AnchorPeers:
      - Host: peer0.Hospital_B.example.com
        Port: 7061

Capabilities:
  Channel: &ChannelCapabilities
    V2_0: true
  Orderer: &OrdererCapabilities
    V2_0: true
  Application: &ApplicationCapabilities
    V2_0: true

Application: &ApplicationDefaults
    Organizations:
    Policies:
        Readers:
            Type: ImplicitMeta
            Rule: "ANY Readers"
        Writers:
            Type: ImplicitMeta
            Rule: "ANY Writers"
        Admins:
            Type: ImplicitMeta
            Rule: "MAJORITY Admins"
    Capabilities:
        <<: *ApplicationCapabilities

Orderer: &OrdererDefaults
    OrdererType: etcdraft
    Addresses:
        - orderer.example.com:7050
    EtcdRaft:
        Consenters:
            - Host: orderer.example.com
              Port: 7050
              ClientTLSCert: crypto-config/ordererOrganizations/example.com/orderers/orderer.example.com/tls/server.crt
              ServerTLSCert: crypto-config/ordererOrganizations/example.com/orderers/orderer.example.com/tls/server.crt
    Capabilities:
        <<: *OrdererCapabilities

Channel: &ChannelDefaults
    Policies:
        Readers:
            Type: ImplicitMeta
            Rule: "ANY Readers"
        Writers:
            Type: ImplicitMeta
            Rule: "ANY Writers"
        Admins:
            Type: ImplicitMeta
            Rule: "MAJORITY Admins"
    Capabilities:
        <<: *ChannelCapabilities

Profiles:
    TwoOrgsOrdererGenesis:
        <<: *ChannelDefaults
        Orderer:
            <<: *OrdererDefaults
            Organizations:
                - *OrdererOrg
            Policies:
                Readers:
                    Type: ImplicitMeta
                    Rule: "ANY Readers"
                Writers:
                    Type: ImplicitMeta
                    Rule: "ANY Writers"
                Admins:
                    Type: ImplicitMeta
                    Rule: "MAJORITY Admins"
        Consortiums:
            SampleConsortium:
                Organizations:
                    - *Hospital_A
                    - *Hospital_B

    TwoOrgsChannel:
        Consortium: SampleConsortium
        <<: *ChannelDefaults
        Application:
            <<: *ApplicationDefaults
            Organizations:
                - *Hospital_A
                - *Hospital_B
            Policies:
                Readers:
                    Type: ImplicitMeta
                    Rule: "ANY Readers"
                Writers:
                    Type: ImplicitMeta
                    Rule: "ANY Writers"
                Admins:
                    Type: ImplicitMeta
                    Rule: "MAJORITY Admins"
            Capabilities:
                <<: *ApplicationCapabilities
